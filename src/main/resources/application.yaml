server:
  port: 8081

grpc:
  server:
    port: 9090

logging:
  config: ${LOGGING_CONFIG:./config/logback.xml}

spring:
  application:
    name: publisher-change-food-card
  datasource:
    oracle:
      url: jdbc:oracle:thin:@localhost:1521:XE
      username: gru
      password: root
      driverClassName: oracle.jdbc.OracleDriver
    postgres:
      url: jdbc:postgresql://localhost:5432/postgres_db
      username: user
      password: root
      driverClassName: org.postgresql.Driver
  files:
    dir: D:/gpb_tasks/generator_file/generated
    data: ./data
    scan-interval: 5000
    retention-days: 3
    cleanup-cron: "0 0 1 * * ?"